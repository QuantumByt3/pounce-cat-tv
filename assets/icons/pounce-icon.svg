<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
>
  <defs>
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#173a59"
      />

      <stop
        offset="100%"
        stop-color="#081522"
      />
    </linearGradient>

    <linearGradient
      id="paw"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop
        offset="0%"
        stop-color="#ffd45e"
      />

      <stop
        offset="100%"
        stop-color="#e7a925"
      />
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    fill="url(#background)"
  />

  <!-- Subtle inner border -->
  <rect
    x="28"
    y="28"
    width="456"
    height="456"
    rx="100"
    fill="none"
    stroke="#f2c14e"
    stroke-width="8"
    opacity="0.4"
  />

  <!-- Paw toes -->
  <ellipse
    cx="154"
    cy="183"
    rx="48"
    ry="62"
    transform="rotate(-26 154 183)"
    fill="url(#paw)"
  />

  <ellipse
    cx="240"
    cy="139"
    rx="48"
    ry="66"
    transform="rotate(-7 240 139)"
    fill="url(#paw)"
  />

  <ellipse
    cx="332"
    cy="160"
    rx="48"
    ry="64"
    transform="rotate(17 332 160)"
    fill="url(#paw)"
  />

  <ellipse
    cx="391"
    cy="230"
    rx="43"
    ry="58"
    transform="rotate(34 391 230)"
    fill="url(#paw)"
  />

  <!-- Main paw pad -->
  <path
    d="
      M132 330
      C132 258 185 218 255 218
      C327 218 384 263 384 333
      C384 395 336 426 286 412
      C263 406 246 406 223 414
      C171 432 132 393 132 330
      Z
    "
    fill="url(#paw)"
  />

  <!-- Small motion accent -->
  <path
    d="
      M94 370
      C67 344 58 310 66 278
    "
    fill="none"
    stroke="#f2c14e"
    stroke-width="18"
    stroke-linecap="round"
    opacity="0.7"
  />
</svg>